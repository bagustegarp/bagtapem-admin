<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin Dashboard - BAGTAPEM</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS (xlsx) for Excel Export -->
    <script src="https://cdn.jsdelivr.com/npm/xlsx@0.18.5/dist/xlsx.full.min.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.com/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen text-slate-800">

    <!-- Top Navigation Bar -->
    <header class="bg-slate-900 text-white shadow-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-shield-halved text-2xl text-blue-500"></i>
                <h1 class="font-bold text-lg tracking-wide uppercase">BAGTAPEM Master Dashboard</h1>
            </div>
            <div class="flex items-center space-x-4">
                <span class="text-xs bg-slate-800 border border-slate-700 text-blue-400 px-3 py-1.5 rounded-full font-mono flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Supabase Connected
                </span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- Controls Header: Stats, Filters, Search & Actions -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-8">
            <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                
                <!-- Search & Status -->
                <div class="flex-1 flex flex-col sm:flex-row gap-3">
                    <div class="relative flex-1">
                        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400"></i>
                        <input type="text" id="searchInput" placeholder="Cari Ref ID, Lokasi, Kecamatan, Keterangan..." 
                               class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">
                    </div>
                    
                    <select id="kategoriFilter" class="bg-slate-50 border border-slate-300 text-slate-700 text-sm rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="">Semua Kategori</option>
                        <option value="PKL">PKL</option>
                        <option value="BANGLI">BANGLI</option>
                        <option value="SPK">SPK</option>
                        <option value="LAINNYA">LAINNYA</option>
                    </select>
                </div>

                <!-- Action Buttons -->
                <div class="flex items-center gap-3">
                    <button id="btnRefresh" onclick="loadData()" class="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-semibold transition-all flex items-center gap-2">
                        <i class="fa-solid fa-rotate-right"></i> Refresh
                    </button>
                    
                    <button id="btnExport" onclick="exportToExcel()" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-semibold shadow-sm hover:shadow transition-all flex items-center gap-2">
                        <i class="fa-solid fa-file-excel"></i> Export Excel (4 Sheet)
                    </button>
                </div>
            </div>
            
            <div class="mt-4 pt-4 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
                <span>Urutan Data: <strong class="text-blue-600 font-semibold">Tanggal Kejadian Terbaru (Descending)</strong></span>
                <span>Total Ditampilkan: <strong id="totalCount" class="text-slate-800 font-bold">0</strong> Data</span>
            </div>
        </div>

        <!-- Table Container -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-600">
                    <thead class="bg-slate-50 border-b border-slate-200 text-xs uppercase font-bold text-slate-500 tracking-wider">
                        <tr>
                            <th class="px-6 py-4">No</th>
                            <th class="px-6 py-4">Ref ID</th>
                            <th class="px-6 py-4">Waktu Kejadian</th>
                            <th class="px-6 py-4">Kategori</th>
                            <th class="px-6 py-4">Kecamatan / Kelurahan</th>
                            <th class="px-6 py-4">Lokasi Detail</th>
                            <th class="px-6 py-4 text-center">Jumlah</th>
                            <th class="px-6 py-4">Dokumen / Lap. PDF</th>
                            <th class="px-6 py-4">Keterangan</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-100">
                        <tr>
                            <td colspan="9" class="text-center py-12 text-slate-400">
                                <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-blue-500"></i>
                                <p class="text-sm">Memuat data dari Supabase...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Document Modal Preview -->
    <div id="pdfModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-4xl h-[85vh] rounded-2xl shadow-2xl flex flex-col overflow-hidden">
            <div class="px-6 py-4 bg-slate-900 text-white flex items-center justify-between">
                <h3 id="modalTitle" class="font-bold text-sm tracking-wide flex items-center gap-2">
                    <i class="fa-solid fa-file-pdf text-red-400 text-lg"></i> Preview Dokumen
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div class="flex-1 bg-slate-200 relative">
                <iframe id="pdfViewer" class="w-full h-full border-0"></iframe>
            </div>
            <div class="px-6 py-3 bg-slate-50 border-t border-slate-200 flex justify-end">
                <button onclick="closeModal()" class="px-5 py-2 bg-slate-700 hover:bg-slate-800 text-white rounded-lg text-xs font-semibold">Tutup</button>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        // Supabase Initialization
        const SUPABASE_URL = 'https://jtsytedrrtknhdfhksdr.supabase.co'; // Sesuaikan URL Supabase kamu
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'; // Sesuaikan Anon/Public Key Supabase kamu
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let globalReportsData = [];

        // Fetch Data from Supabase
        async function loadData() {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = `
                <tr>
                    <td colspan="9" class="text-center py-12 text-slate-400">
                        <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-blue-500"></i>
                        <p class="text-sm">Memuat data dari Supabase...</p>
                    </td>
                </tr>`;

            try {
                // DI SINI PERUBAHAN UTAMANYA: Data diurutkan berdasarkan tanggal kejadian ('waktu') terbaru di paling atas
                const { data, error } = await supabase
                    .from('pkl_reports')
                    .select('*')
                    .order('waktu', { ascending: false }); // <-- Tanggal Kejadian Terbaru di Atas

                if (error) throw error;

                globalReportsData = data || [];
                renderTable(globalReportsData);
            } catch (err) {
                console.error('Error fetching data:', err);
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="9" class="text-center py-8 text-red-500 font-semibold">
                            <i class="fa-solid fa-triangle-exclamation text-2xl mb-2"></i><br>
                            Gagal mengambil data dari database Supabase!
                        </td>
                    </tr>`;
            }
        }

        // Render Data Table
        function renderTable(data) {
            const tableBody = document.getElementById('tableBody');
            document.getElementById('totalCount').innerText = data.length;

            if (data.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="9" class="text-center py-8 text-slate-400">Tidak ada data ditemukan.</td>
                    </tr>`;
                return;
            }

            let html = '';
            data.forEach((item, index) => {
                const refIdDisplay = item.ref_id || item.id || '-';
                const tanggalKejadian = item.waktu ? new Date(item.waktu).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) : '-';
                
                // Document Button/Link Preview
                let docBtn = '<span class="text-slate-400 italic text-xs">Tidak Ada</span>';
                if (item.pdf_url) {
                    docBtn = `<button onclick="openModal('${item.pdf_url}', '${item.pdf_name || 'Dokumen PDF'}')" 
                                      class="inline-flex items-center gap-1.5 px-3 py-1 bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 rounded-md text-xs font-semibold transition-all">
                                <i class="fa-solid fa-file-pdf"></i> ${item.pdf_name || 'Lihat PDF'}
                              </button>`;
                }

                html += `
                    <tr class="hover:bg-slate-50/80 transition-colors">
                        <td class="px-6 py-4 font-semibold text-slate-400 text-xs">${index + 1}</td>
                        <td class="px-6 py-4">
                            <span class="font-mono font-extrabold text-[11px] text-blue-900 bg-blue-100/80 px-2.5 py-1 rounded-md border border-blue-200">
                                ${refIdDisplay}
                            </span>
                        </td>
                        <td class="px-6 py-4 font-semibold text-slate-700">${tanggalKejadian}</td>
                        <td class="px-6 py-4">
                            <span class="inline-block px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-slate-100 text-slate-700 uppercase">
                                ${item.kategori_laporan || '-'}
                            </span>
                        </td>
                        <td class="px-6 py-4">
                            <div class="font-bold text-slate-800">${item.kecamatan || '-'}</div>
                            <div class="text-xs text-slate-500">${item.kelurahan || '-'}</div>
                        </td>
                        <td class="px-6 py-4 max-w-xs truncate text-slate-600" title="${item.lokasi || ''}">
                            ${item.lokasi || '-'}
                        </td>
                        <td class="px-6 py-4 text-center font-bold text-slate-800">${item.jumlah || 0}</td>
                        <td class="px-6 py-4">${docBtn}</td>
                        <td class="px-6 py-4 max-w-xs truncate text-xs text-slate-500" title="${item.keterangan || ''}">
                            ${item.keterangan || '-'}
                        </td>
                    </tr>`;
            });

            tableBody.innerHTML = html;
        }

        // Search & Filter Listeners
        document.getElementById('searchInput').addEventListener('input', filterTable);
        document.getElementById('kategoriFilter').addEventListener('change', filterTable);

        function filterTable() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const selectedKategori = document.getElementById('kategoriFilter').value.toUpperCase();

            const filtered = globalReportsData.filter(item => {
                const ref = (item.ref_id || item.id || '').toLowerCase();
                const kec = (item.kecamatan || '').toLowerCase();
                const kel = (item.kelurahan || '').toLowerCase();
                const lok = (item.lokasi || '').toLowerCase();
                const ket = (item.keterangan || '').toLowerCase();
                const kat = (item.kategori_laporan || '').toUpperCase();

                const matchQuery = ref.includes(query) || kec.includes(query) || kel.includes(query) || lok.includes(query) || ket.includes(query);
                const matchKategori = selectedKategori === '' || kat === selectedKategori;

                return matchQuery && matchKategori;
            });

            renderTable(filtered);
        }

        // Modal Functions
        function openModal(url, filename) {
            document.getElementById('modalTitle').innerHTML = `<i class="fa-solid fa-file-pdf text-red-400 text-lg"></i> ${filename}`;
            document.getElementById('pdfViewer').src = url;
            document.getElementById('pdfModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('pdfViewer').src = '';
            document.getElementById('pdfModal').classList.add('hidden');
        }

        // Multi-Sheet Excel Export Functionality
        function exportToExcel() {
            if (globalReportsData.length === 0) {
                alert('Tidak ada data yang dapat diekspor!');
                return;
            }

            const wb = XLSX.utils.book_new();
            const categories = ['PKL', 'BANGLI', 'SPK', 'LAINNYA'];

            categories.forEach(cat => {
                const filteredCat = globalReportsData.filter(item => (item.kategori_laporan || '').toUpperCase() === cat);
                const sheetData = filteredCat.map((item, idx) => ({
                    'No': idx + 1,
                    'Ref ID': item.ref_id || item.id || '-',
                    'Waktu Kejadian': item.waktu || '-',
                    'Kategori': item.kategori_laporan || '-',
                    'Kecamatan': item.kecamatan || '-',
                    'Kelurahan': item.kelurahan || '-',
                    'Lokasi Detail': item.lokasi || '-',
                    'Jumlah': item.jumlah || 0,
                    'Data PKL / Objek': item.datapkl || '-',
                    'Keterangan': item.keterangan || '-',
                    'URL PDF': item.pdf_url || '-'
                }));

                const ws = XLSX.utils.json_to_array ? XLSX.utils.json_to_sheet(sheetData) : XLSX.utils.json_to_sheet(sheetData);
                XLSX.utils.book_append_sheet(wb, ws, cat);
            });

            XLSX.writeFile(wb, `Laporan_BAGTAPEM_${new Date().toISOString().slice(0,10)}.xlsx`);
        }

        // Initial Load
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
